<!DOCTYPE html>
<html>

<body>

    <h2>JavaScript For Loop</h2>
    <p id="demo"></p>
    <script>
        var food = ["Pizza", "Pasta", "Chicken", "HotDog", "Chips"];
        var foo = "";
        var i;

        for(i = 0; i < food.length; i++)
    {
        foo += food[i] + "<br>";
    }

    document.getElementById("demo").innerHTML = foo;
        </script>
</body>
</html>
