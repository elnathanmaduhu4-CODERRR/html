<!DOCTYPE html>
<html>
<head>
    <title>My Superhero Card</title>
    <style>

body {
    background-color: darkgreen;
    font-family: Arial, sans-serif;
}

.fact-file {
    background-color: lightyellow;
    color: darkslategray;
    width: 300px;
    padding: 30px;
    border: 50px dashed rgb(139, 34, 73);
    margin: auto;
}

.animal-name {
    color: forestgreen;
    font-size: 22px;
}

.detail {
    color: darkslategray;
}

.cool-fact {
    color: rgb(0, 4, 255);
    font-style: italic;
}

</style>
</head>
<body>

    <div class="fact-file">
        <h2 class="animal-name">Snow Leopard</h2>
        <p class="detail">Type: Big Cat</p>
        <p class="detail">Lives in:Mountain ranges of Central Asia</p>
        <p class="detail">Diet: Deer, goats, and wild sheep</p>
        <p class="cool-fact">Cool Fact: Can leapp up to 15 metres in one juump!</p>
    </div>
</body>
</html>
