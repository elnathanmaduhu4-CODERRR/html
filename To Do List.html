<!DOCTYPE html>
<html>
    <head>
        <title>To do list</title>
        <style>
            body {
                font: 12px system-ui,
                  sans-serif;
                  max-width: 240px;
                  margin: 20px auto;
                  padding: 10px;
                  border: 1px solid #ddd;
                  border-radius: 6px;
                  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            }
            h3 {
                font-size: 11px;
                text-transform: uppercase;
                color: #4f46e5;
                margin: 10px 0 4px;
            }
            h3:first-of-type {
                margin-top: 0;
            }
            #myForm {
                display: flex;
                gap: 10px;
            }
            #myInput {
                flex: 1;
                padding: 4px;
                border: 1px solid #ccc;
                border-radius: 4px;
                outline: none;
            }
            #myInput:focus {
                border-color: #4f46e5;
            }
            #myForm button {
                background: #4f46e5;
                color: #fff;
                border: none;
                padding: 4px 8px;
                border-radius: 4px;
                cursor: pointer;
            }
            #myItem {
                list-style: none;
                padding: 0;
                margin: 0;
            }
            #myItem li {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 4px 6px;
                background: #f9f9f9;
                border-radius: 4px;
                margin-bottom: 4px;
            }
            #myItem button {
                background: none;
                border: none;
                color: #ef4444;
                cursor: pointer;
                font-size: 10px;
            }
        </style>
    </head>

    <body>
        <h3>Add your To Do List here</h3>
        <form id="myForm">
            <input id="myInput" type="text" />
            <button>Add</button>
        </form>

        <h3>To Do List</h3>
        <ul id="myItem"></ul>
        <script>
            var myForm = document.getElementById("myForm");
            var myInput = document.getElementById("myInput");
            var myItem = document.getElementById("myItem");

            myForm.addEventListener("submit", function (event) {
                event.preventDefault();
                if(myInput.value.trim() === "") {
                    myInput.placeholder = "Please enter a task.";
                    myInput.style.borderColor = "ef4444";
                    return;
                }
                else {
                    myInput.placeholder = "Enter a task";
                    myInput.style.borderColor = "#ccc";
                }
                createItem(myInput.value);
            });
        </script>
    </body>
</html>
