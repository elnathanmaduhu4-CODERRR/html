<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Roll the Dice</title>

        <style>
            body {
                margin: 0;
                height: 120vh;
                display: flex;
                justify-content: center;
                align-items: center;
                font-family: "Comic Sans MS", Arial,  sans-serif;
                background: linear-gradient(150deg, blueviolet, orangered);
                color: red;
                text-align: center;
            }

            .container {
                width: 100%;
            }

            h1 {
                font-size: 25px;
                margin-bottom: 10px;
            }

            P {
                font-size: 50px;
                margin-bottom: 20px;
            }

            #dice {
                font-size: 200px;
                cursor: pointer;
                display: inline-block;
                text-shadow: 0px 0px 15px whitesmoke;
            }

            #dice:hover {
                transform: scale(1.4);
            }

            .shake {
                animation: bounce 0.15s infinite;
            }

            @keyframes bounce {
                0% {
                    transform: translateY(0);
                }
                50% {
                    transform: translateY(-25px);
                }
                100% {
                    transform: translateY(0);
                }
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>🎲 Roll the Dice!</h1>

            <p>Click the dice to roll it!</p>

            <div id="dice"></div>
        </div>

        <script>
            var dices = [
                "&#9856;",
                "&#9857;",
                "&#9858;",
                "&#9859;",
                "&#9860;",
                "&#9861;",
            ];

            var dice = document.getElementById("dice");
            var timer;

            // change the dice face
            function changeDice() {
                var random = Math.floor(Math.random() * 6);
                dice.innerHTML = dices[random];
            }

            // Roll the dice
            function rollDice() {
                clearInterval(timer);

                dice.classList.add("shake");

                timer = setInterval(changeDice, 100); // runs every 100ms to show random dice faces

                setTimeout(function () {           // runs only once

                                 clearInterval(timer); // stop the random dice faces

                                 dice.classList.remove("shake");

                                 changeDice(); // Final random number
                }, 1500);
            }

            // Roll when the dice is clicked
            dice.onclick = rollDice;

            // Show a random dice when the page loads
            changeDice();
        </script>
    </body>
</html>
